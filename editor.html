<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Beyond The Veil - Level Editor</title>

    <link rel="stylesheet" href="./css/editor.css">

</head>


<body>

    <div id="toolbar">

        <button id="platformTool">
            Platform
        </button>

        <button id="spawnTool">
            Spawn
        </button>

        <button id="eraseTool">
            Erase
        </button>

        <button id="loadButton">
            Load Level
        </button>

        <!-- Scene selection -->
        <label>
            Scene
            <select id="backgroundSelect"></select>
        </label>

        <!-- Platform style selection -->
        <label>
            Platform
            <select id="platformStyleSelect"></select>
        </label>

        <!-- Platform color selection -->
        <label>
            Color
            <input
                id="platformColorInput"
                type="color"
                value="#737d81"
            >
        </label>

        <button id="saveButton">
            Save
        </button>

    </div>


    <div id="propertiesPanel">

        <h3>Platform</h3>

        <label>
            X
            <input
                id="propertyX"
                type="number"
            >
        </label>

        <label>
            Y
            <input
                id="propertyY"
                type="number"
            >
        </label>

        <label>
            Width
            <input
                id="propertyWidth"
                type="number"
            >
        </label>

        <label>
            Height
            <input
                id="propertyHeight"
                type="number"
            >
        </label>

        <button id="applyProperties">
            Apply
        </button>

    </div>


    <input
        type="file"
        id="levelFileInput"
        accept=".json"
        hidden
    >


    <canvas id="editorCanvas"></canvas>


    <script
        type="module"
        src="./js/editor.js"
    ></script>

</body>

</html>
