<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Beyond The Veil - Level Editor</title>

    <link rel="stylesheet" href="./css/editor.css">

</head>


<body>

    <div id="toolbar">

        <!-- LEVEL SELECTOR -->

        <label id="levelSelectorLabel">

            Level

            <select id="levelSelect">

                <option value="1">
                    Level 1
                </option>

                <option value="2">
                    Level 2
                </option>

                <option value="3">
                    Level 3
                </option>

                <option value="4">
                    Level 4
                </option>

                <option value="5">
                    Level 5
                </option>

            </select>

        </label>


        <!-- BACKGROUND -->

        <label id="backgroundLabel">

            Scene

            <select id="backgroundSelect"></select>

        </label>


        <!-- PLATFORM STYLE -->

        <label id="platformStyleLabel">

            Platform

            <select id="platformStyleSelect"></select>

        </label>


        <!-- PLATFORM COLOR -->

        <label id="platformColorLabel">

            Color

            <input
                id="platformColorInput"
                type="color"
                value="#737d81"
            >

        </label>


        <!-- TOOLS -->

        <button id="platformTool">

            Platform

        </button>


        <button id="spawnTool">

            Spawn

        </button>


        <button id="eraseTool">

            Erase

        </button>


        <button id="loadButton">

            Load Level

        </button>


        <button id="saveButton">

            Save

        </button>

    </div>


    <!-- PROPERTIES PANEL -->

    <div id="propertiesPanel">

        <h3>Platform</h3>


        <label>

            X

            <input
                id="propertyX"
                type="number"
            >

        </label>


        <label>

            Y

            <input
                id="propertyY"
                type="number"
            >

        </label>


        <label>

            Width

            <input
                id="propertyWidth"
                type="number"
            >

        </label>


        <label>

            Height

            <input
                id="propertyHeight"
                type="number"
            >

        </label>


        <button id="applyProperties">

            Apply

        </button>

    </div>


    <!-- HIDDEN FILE INPUT -->

    <input
        type="file"
        id="levelFileInput"
        accept=".json"
        hidden
    >


    <!-- EDITOR CANVAS -->

    <canvas id="editorCanvas"></canvas>


    <script
        type="module"
        src="./js/editor.js"
    ></script>

</body>

</html>
